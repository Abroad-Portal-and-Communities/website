name: Lint

on:
  pull_request:
    paths-ignore:
      - "public/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "public/**"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: "0.162.0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      hugo: ${{ steps.filter.outputs.hugo }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            hugo:
              - 'content/**'
              - 'data/**'
              - 'assets/js/**'
              - 'layouts/**'
              - 'assets/**'
              - 'static/**'
              - 'config/**'
              - 'go.mod'
              - 'go.sum'
            markdown:
              - 'content/**'
              - 'README.md'
              - '.markdownlint.yaml'

  hugo:
    name: Hugo build
    needs: changes
    if: needs.changes.outputs.hugo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            /tmp/hugo_cache
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - run: hugo --baseURL "http://localhost/"

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            content
            README.md
            .markdownlint.yaml

      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yaml
          globs: |
            content/**/*.md
            README.md
