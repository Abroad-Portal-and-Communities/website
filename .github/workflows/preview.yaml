name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.162.0"
  PAGES_SITE_URL: https://abroad-portal-and-communities.github.io/websites/
  # pr-preview-action expects host/path without protocol
  PAGES_BASE_URL: abroad-portal-and-communities.github.io/websites/

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Go
        if: github.event.action != 'closed'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Hugo and Go modules
        if: github.event.action != 'closed'
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-

      - name: Setup Hugo
        if: github.event.action != 'closed'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site for preview
        if: github.event.action != 'closed'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod tidy
          hugo --gc --minify --baseURL "${{ env.PAGES_SITE_URL }}pr-preview/pr-${{ github.event.number }}/"

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        continue-on-error: ${{ github.event.action == 'closed' }}
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ env.PAGES_BASE_URL }}
          wait-for-pages-deployment: true
          action: auto
