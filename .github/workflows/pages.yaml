name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.162.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Hugo and Go modules
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_PARAMS_SURVEY_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HUGO_PARAMS_SURVEY_SUPABASE_ANONKEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE="${BASE%/}"
          echo "Building with baseURL: ${BASE}/"
          hugo --gc --minify --baseURL "${BASE}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    # github-pages environment only allows main/gh-pages by default; PR branches fail deploy.
    # Build still runs on pull_request to verify Hugo. Merge to main for production deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
