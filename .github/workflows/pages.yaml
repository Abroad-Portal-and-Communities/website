name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.162.0"
  PAGES_BASE_URL: https://abroad-portal-and-communities.github.io/websites/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Hugo and Go modules
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod tidy
          hugo --gc --minify --baseURL "${{ env.PAGES_BASE_URL }}"

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean-exclude: pr-preview
          force: false
          single-commit: true
