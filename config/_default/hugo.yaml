# Site configuration
title: APC Websites
baseURL: https://abroad-portal-and-communities.github.io/website/

disableHugoGeneratorInject: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Working Abroad
      pageRef: /docs/working-abroad
      weight: 2
    - name: Career Plan
      pageRef: /docs/career-plan
      weight: 3
    - name: Events
      pageRef: /events
      weight: 4
    - name: Survey
      pageRef: /survey
      weight: 5
    - name: About
      pageRef: /about
      weight: 6
    - name: Search
      weight: 7
      params:
        type: search

params:
  description: APC community documentation, events, and sharing sessions.

  banner:
    key: welcome
    message: |
      Welcome — explore [Career Plan](/docs/career-plan/), [Working Abroad](/docs/working-abroad/), or [events](/events/).

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: false
    copyright: "© Abroad Portal and Communities"
    width: wide

  editURL:
    enable: false

  # Survey → Supabase. Set in config/development/hugo.yaml (local) or GitHub Actions secrets (production).
  survey:
    supabase:
      url: ""
      anonkey: ""
