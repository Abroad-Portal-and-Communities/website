# Site configuration
title: APC Website
baseURL: https://abroad-portal-and-communities.github.io/website/
defaultContentLanguage: en

disableHugoGeneratorInject: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - identifier: docs
      name: Docs
      pageRef: /docs
      weight: 1
    - identifier: workingAbroad
      name: Working Abroad
      pageRef: /docs/working-abroad
      weight: 2
    - identifier: careerPlan
      name: Career Plan
      pageRef: /docs/career-plan
      weight: 3
    - identifier: events
      name: Events
      pageRef: /events
      weight: 4
    - identifier: survey
      name: Survey
      pageRef: /survey
      weight: 5
    - identifier: about
      name: About
      pageRef: /about
      weight: 6
    - identifier: search
      name: Search
      weight: 7
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: false
    copyright: "© Abroad Portal and Communities"
    width: wide

  social:
    instagram: https://www.instagram.com/abroadportalcommunity/
    youtube: https://www.youtube.com/@AbroadPortalCommunity
    linkedin: https://www.linkedin.com/company/abroad-portal-communities/

  editURL:
    enable: false

  # Giscus (GitHub Discussions). Enable per page with `comments: true` in front matter.
  # IDs from https://giscus.app — repo must have Discussions on and the giscus GitHub App installed.
  comments:
    enable: false
    type: giscus
    giscus:
      repo: Abroad-Portal-and-Communities/website
      repoId: R_kgDOSpQR4A
      category: General
      categoryId: DIC_kwDOSpQR4M4C99r1
      mapping: pathname
      reactionsEnabled: 1

  # Survey → Supabase. Set in config/development/hugo.yaml (local) or GitHub Actions secrets (production).
  survey:
    supabase:
      url: ""
      anonkey: ""
